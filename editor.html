<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Room editor</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="pano.css">
</head>

<!-- The room editor. Drop images to fill the tray, right-click a tile to set the
     background (or place tiles as props by right-clicking the scene), then
     "save room" to download a room file. data-edit turns on the editor. The hub
     panorama is just a placeholder backdrop until you set your own. You can also
     edit any existing room in place by appending ?edit=1 to its URL. -->
<body data-edit="1" data-pano="images/pano-hub.webp" data-room="Untitled" data-fov="80">

<div id="props"></div>
<nav id="hotspots"></nav>

<script src="pano.js"></script>
</body>
</html>
