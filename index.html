<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Scott Metoyer</title>
<meta name="description" content="A 360° space you can look around in.">
<meta property="og:title" content="Scott Metoyer">
<meta property="og:description" content="A 360° space you can look around in.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="pano.css">
</head>

<!-- A room: which panorama, where you start, and where you can go.
     yaw/pitch are degrees; yaw 0 is straight ahead, increasing to the right. -->
<body data-pano="images/pano-hub.png" data-room="The Plain" data-yaw="0" data-fov="78">

<!-- Props: clickable images planted in the scene. data-yaw/data-pitch aim at
     the figure's feet; data-height is its size in degrees of view. The
     <template> holds whatever the dialog should show. -->
<div id="props">
  <button class="prop" data-src="images/sprite-suit.png" data-alt="A man in a suit"
          data-yaw="24" data-pitch="-20" data-height="34">
    <template>
      <h2>Someone</h2>
      <p>A figure standing on the plain. There's nothing to say yet.</p>
    </template>
  </button>
</div>

<nav id="hotspots">
  <a class="hotspot" href="hall.html" data-yaw="90"  data-pitch="6">The Hall</a>
  <a class="hotspot" href="void.html" data-yaw="270" data-pitch="6">The Void</a>
</nav>

<noscript>This place needs JavaScript to render. The exits are below.</noscript>

<script src="pano.js"></script>
</body>
</html>
